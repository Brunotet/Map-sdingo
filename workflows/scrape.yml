name: Scrape Google Maps leads

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Business niche/category, e.g. 'hair salons'"
        required: true
      location:
        description: "City/area, e.g. 'Nelspruit'"
        required: true
      max_results:
        description: "Max eligible leads to return"
        required: false
        default: "50"
      min_rating:
        description: "Minimum star rating to qualify"
        required: false
        default: "3.5"
      country:
        description: "2-letter country code for the Ad Library intent check"
        required: false
        default: "ZA"
      depth:
        description: "Maps scroll depth (raise this if too few leads survive filtering)"
        required: false
        default: "5"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper pipeline
        env:
          WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          SEEN_LOOKUP_URL: ${{ secrets.N8N_SEEN_LOOKUP_URL }}
        run: |
          python -m scraper.main \
            --niche "${{ inputs.niche }}" \
            --location "${{ inputs.location }}" \
            --max-results "${{ inputs.max_results }}" \
            --min-rating "${{ inputs.min_rating }}" \
            --country "${{ inputs.country }}" \
            --depth "${{ inputs.depth }}"

      - name: Upload leads as artifact
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ inputs.niche }}-${{ inputs.location }}
          path: leads.json
