name: Scrape Google Maps leads

on:
  workflow_dispatch:
    inputs:
      niche:
        description: "Business niche/category, e.g. 'hair salons'"
        required: true
      location:
        description: "City/area, e.g. 'Nelspruit' — ignored in whole_country mode"
        required: true
      max_results:
        description: "Max eligible leads to return"
        required: false
        default: "50"
      min_rating:
        description: "Minimum star rating to qualify"
        required: false
        default: "3.5"
      country:
        description: "2-letter country code for the Ad Library intent check, directory selection, and phone classification"
        required: false
        default: "ZA"
      depth:
        description: "Maps scroll depth (raise this if too few leads survive filtering)"
        required: false
        default: "5"
      callback_url:
        description: "n8n Wait-node resume URL for this run (from $execution.resumeUrl) — results get POSTed here"
        required: true
      scrape_timeout:
        description: "Max seconds to let the Maps scrape itself run (separate from this job's overall timeout)"
        required: false
        default: "2700"
      skip_directory:
        description: "Skip the directory entirely and go straight to Google Maps"
        required: false
        type: boolean
        default: false
      whole_country:
        description: "Loop city-by-city across the whole country instead of a single location. WARNING: much longer runtime — a single city can already take 10+ minutes, so this can run well over an hour depending on max_cities."
        required: false
        type: boolean
        default: false
      max_cities:
        description: "How many of the country's biggest cities to loop through in whole_country mode. Keep this modest — each city costs real time."
        required: false
        default: "8"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper pipeline
        env:
          SEEN_LOOKUP_URL: ${{ secrets.N8N_SEEN_LOOKUP_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python -m scraper.main \
            --niche "${{ inputs.niche }}" \
            --location "${{ inputs.location }}" \
            --max-results "${{ inputs.max_results }}" \
            --min-rating "${{ inputs.min_rating }}" \
            --country "${{ inputs.country }}" \
            --depth "${{ inputs.depth }}" \
            --scrape-timeout "${{ inputs.scrape_timeout }}" \
            --webhook-url "${{ inputs.callback_url }}" \
            --max-cities "${{ inputs.max_cities }}" \
            --skip-directory "${{ inputs.skip_directory }}" \
            --whole-country "${{ inputs.whole_country }}"

      - name: Upload leads as artifact
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ inputs.niche }}-${{ inputs.location }}
          path: leads.json
